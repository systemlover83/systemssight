<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>profile</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23a855f7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div id="not-found" class="center-shell" hidden style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <div style="text-align:center;color:#9ca0ad;font-family:system-ui,sans-serif;">
    <h1 style="color:#f4f4f7;">user not found</h1>
    <p>no page exists at this url.</p>
    <p><a href="/signup/" style="color:#22d3ee;">make your own →</a></p>
  </div>
</div>

<div id="page-content" hidden>
  <canvas id="bg-canvas"></canvas>
  <video id="bg-video" autoplay muted loop playsinline></video>
  <div id="bg-image"></div>
  <div id="bg-overlay"></div>

  <div id="cursor-dot" class="cursor-el"></div>
  <div id="cursor-ring" class="cursor-el"></div>

  <main class="card">
    <div class="card-glow"></div>

    <div class="avatar-wrap">
      <img id="avatar" src="" alt="avatar">
    </div>

    <h1 id="display-name"></h1>
    <p id="handle"></p>

    <div id="badges" class="badges"></div>

    <p id="bio" class="bio"></p>

    <div id="socials" class="socials"></div>

    <div id="view-counter" class="view-counter" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
      <span id="view-count">0</span>
    </div>
  </main>

  <button id="music-toggle" class="music-toggle" hidden aria-label="Toggle music">
    <svg id="music-icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg id="music-icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <audio id="music-audio" loop></audio>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="../render.js"></script>
<script src="viewer.js"></script>
</body>
</html>
