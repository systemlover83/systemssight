<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>freeram — systemlover</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%234dff00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --accent: #4dff00; --accent2: #000000; --bg: #05050a; --text: #f4f4f7; --text-dim: #9ca0ad; --border: rgba(255,255,255,0.08); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .card {
    width: 100%; max-width: 420px; background: rgba(15,15,22,0.6); backdrop-filter: blur(18px);
    border: 1px solid var(--border); border-radius: 24px; padding: 36px 28px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-size: 26px; margin-bottom: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { color: var(--text-dim); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  a.back { color: var(--accent); text-decoration: none; font-size: 13px; }
  a.back:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>freeram</h1>
    <p>the download isn't hooked up yet — nothing here to grab just yet.</p>
    <a class="back" href="/">&larr; back to systemlover.xyz</a>
  </div>
</body>
</html>
