<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>log in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23a855f7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../auth.css">
</head>
<body>
<div class="center-shell">
  <form id="login-form" class="auth-box">
    <h1>log in</h1>
    <p class="sub dim">welcome back</p>

    <label>email</label>
    <input id="f-email" type="email" autocomplete="email" required>

    <label>password</label>
    <input id="f-password" type="password" autocomplete="current-password" required>

    <button type="submit" id="btn-submit">log in</button>
    <div id="msg" class="msg" hidden></div>

    <p class="foot-link dim">no account yet? <a href="../signup/">sign up</a></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="../auth-helpers.js"></script>
<script src="login.js"></script>
</body>
</html>
