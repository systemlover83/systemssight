<style>
  :root {
    --blue: #1877F2; --blue-dark: #0b5fcc; --bg: #f5f7fa; --panel: #ffffff;
    --text: #050505; --text-dim: #65676b; --border: #e4e6eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 32px 16px;
  }
  .card {
    width: 100%; max-width: 440px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 16px; padding: 40px 32px;
    text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .logo {
    width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--blue), #42a5f5);
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 28px; height: 28px; }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  p.sub { color: var(--text-dim); font-size: 14px; line-height: 1.6; margin-bottom: 26px; }
  a.dl-btn {
    display: block; width: 100%; padding: 13px 20px; border-radius: 8px;
    background: var(--blue); color: #fff; font-weight: 700; font-size: 15px;
    text-decoration: none; transition: background .15s ease;
  }
  a.dl-btn:hover { background: var(--blue-dark); }
  p.meta { color: var(--text-dim); font-size: 12px; margin-top: 14px; }
  a.back { display: inline-block; margin-top: 24px; color: var(--text-dim); text-decoration: none; font-size: 13px; }
  a.back:hover { text-decoration: underline; }
</style>

  <div class="card">
