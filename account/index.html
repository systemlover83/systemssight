<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>my account</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23a855f7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="account.css">
</head>
<body>

<div id="loading" class="center-shell"><p class="dim">loading…</p></div>

<div id="editor" class="editor" hidden>
  <header class="topbar">
    <h1 id="page-link-wrap">my page: <a id="page-link" href="#" target="_blank">…</a></h1>
    <div class="topbar-actions">
      <button id="btn-logout" class="btn-ghost">log out</button>
    </div>
  </header>

  <div id="status" class="status" hidden></div>

  <section class="panel">
    <h2>Profile</h2>
    <label>Display name</label>
    <input id="f-displayName" type="text">

    <label>Handle</label>
    <input id="f-handle" type="text">

    <label>Bio</label>
    <textarea id="f-bio" rows="2"></textarea>

    <label>Avatar</label>
    <div class="row align-center">
      <img id="avatar-preview" class="avatar-preview">
      <input id="f-avatar-file" type="file" accept="image/*">
    </div>

    <label>Badges</label>
    <div id="badges-list" class="dynamic-list"></div>
    <button id="btn-add-badge" type="button" class="btn-secondary">+ add badge</button>
  </section>

  <section class="panel">
    <h2>Theme</h2>
    <div class="row">
      <div>
        <label>Accent color</label>
        <input id="f-accent" type="color">
      </div>
      <div>
        <label>Accent color 2</label>
        <input id="f-accent2" type="color">
      </div>
    </div>

    <label>Background type</label>
    <select id="f-bgType">
      <option value="particles">particles</option>
      <option value="image">image</option>
      <option value="video">video</option>
      <option value="solid">solid</option>
    </select>

    <div id="bg-media-row" hidden>
      <label>Background file</label>
      <input id="f-bgMedia-file" type="file" accept="image/*,video/*">
      <p id="bg-media-current" class="dim"></p>
    </div>
  </section>

  <section class="panel">
    <h2>Socials</h2>
    <div id="socials-presets" class="socials-grid"></div>

    <label>Custom links</label>
    <div id="custom-list" class="dynamic-list"></div>
    <button id="btn-add-custom" type="button" class="btn-secondary">+ add custom link</button>
  </section>

  <section class="panel">
    <h2>Features</h2>
    <label class="toggle-row"><input id="f-typewriter" type="checkbox"> Typewriter bio animation</label>
    <label class="toggle-row"><input id="f-cursor" type="checkbox"> Custom glowing cursor</label>
    <label class="toggle-row"><input id="f-particles" type="checkbox"> Particle background (only used if theme background type = particles)</label>
    <label class="toggle-row"><input id="f-viewcounter" type="checkbox"> View counter</label>

    <label class="toggle-row"><input id="f-music-enabled" type="checkbox"> Music player</label>
    <div id="music-fields" class="indent">
      <label>Track title</label>
      <input id="f-music-title" type="text">
      <label>Track file (mp3)</label>
      <input id="f-music-file" type="file" accept="audio/*">
      <p id="music-current" class="dim"></p>
    </div>
  </section>

  <button id="btn-save" class="btn-primary">save</button>
  <p id="save-log" class="dim"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="../auth-helpers.js"></script>
<script src="account.js"></script>
</body>
</html>
