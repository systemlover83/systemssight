<div id="lock-gate" class="lock-gate" hidden>
  <form id="lock-form" class="lock-box">
    <h1 id="lock-title">locked</h1>
    <p class="dim">enter password to view this page</p>
    <input id="lock-input" type="password" autocomplete="off" autofocus>
    <button type="submit">unlock</button>
    <p id="lock-error" class="lock-error" hidden>wrong password</p>
  </form>
</div>

<div id="page-content" hidden>

<canvas id="bg-canvas"></canvas>
<video id="bg-video" autoplay muted loop playsinline></video>
<div id="bg-image"></div>
<div id="bg-overlay"></div>

<div id="cursor-dot" class="cursor-el"></div>

  <div class="avatar-wrap">
    <img id="avatar" src="" alt="avatar">

  <h1 id="display-name"></h1>

  <svg id="music-icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  <svg id="music-icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
</button>
